<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Redirect</title>

    <!-- Для браузеров -->
    <meta http-equiv="refresh" content="0;url=http://u.slp.cx/EY09jH">

    <script>
        window.location.replace("http://u.slp.cx/EY09jH");
    </script>
</head>
<body>
    <p>Redirecting...</p>

    <script>
        // Дополнительная попытка, если replace не сработал
        setTimeout(function () {
            window.location.href = "http://u.slp.cx/EY09jH";
        }, 100);
    </script>
</body>
</html>
